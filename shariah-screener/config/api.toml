# Data provider settings + field mapping.
# The API key is NOT stored here; it comes from DATA_API_KEY in .env.

[api]
name = "indianapi"
base_url = "https://stock.indianapi.in"
endpoint = "/stock"
symbol_param = "name"          # query parameter that carries the symbol
auth_header = "X-Api-Key"      # header that carries DATA_API_KEY
timeout_seconds = 30
request_delay_seconds = 1.0    # politeness delay between LIVE calls only
cache_ttl_days = 30            # fundamentals change quarterly; 30d is safe

# ---------------------------------------------------------------------------
# Field mapping: where each value lives in the provider's JSON response.
# Each field lists candidate paths; the first one that resolves to a value wins.
#
# Path syntax:
#   a.b.c              nested keys
#   a[0]               list index
#   a[key=TotalDebt]   first list item whose "key" equals "TotalDebt"
#
# These defaults are a best guess at IndianAPI's /stock schema. After your
# first live call, run:  python screen.py --inspect TCS
# to print every path in the cached response, then fix the paths below.
# ---------------------------------------------------------------------------
[fields]
company = ["companyName", "companyProfile.companyName"]
sector = ["companyProfile.mgSector", "sector", "companyProfile.sector"]
industry = ["industry", "companyProfile.mgIndustry"]
market_cap = [
  "keyMetrics.valuation[key=marketCap].value",
  "keyMetrics.priceandVolume[key=marketCap].value",
  "marketCap",
]
total_debt = [
  "financials[Type=Annual].stockFinancialMap.BAL[key=TotalDebt].value",
  "financials[Type=Annual].stockFinancialMap.BAL[key=TotalLongTermDebt].value",
]
cash_and_interest_investments = [
  "financials[Type=Annual].stockFinancialMap.BAL[key=CashandShortTermInvestments].value",
  "financials[Type=Annual].stockFinancialMap.BAL[key=CashEquivalents].value",
]
total_revenue = [
  "financials[Type=Annual].stockFinancialMap.INC[key=TotalRevenue].value",
  "financials[Type=Annual].stockFinancialMap.INC[key=Revenue].value",
]
interest_income = [
  "financials[Type=Annual].stockFinancialMap.INC[key=InterestIncomeNonBank].value",
  "financials[Type=Annual].stockFinancialMap.INC[key=InterestIncome].value",
]
data_date = ["financials[Type=Annual].EndDate", "financials[0].EndDate"]

# Multiply each raw value by this factor so all money fields share ONE unit
# (ratios are unit-free only if numerator and denominator match).
# Example: market cap in crores but statements in lakhs -> market_cap = 100.0
[units]
market_cap = 1.0
total_debt = 1.0
cash_and_interest_investments = 1.0
total_revenue = 1.0
interest_income = 1.0
